spring.application.name=hospital-manager
server.port=8080

# ---------- MongoDB ----------
# The database and collections are created automatically on first start.
# Override with the environment variable MONGODB_URI (e.g. a MongoDB Atlas connection string).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital}
# creates the unique index on users.username
spring.data.mongodb.auto-index-creation=true

# ---------- JWT ----------
# Base64-encoded HMAC-SHA256 key (at least 256 bits). Keep it secret; override with JWT_SECRET.
app.jwt.secret=${JWT_SECRET:OX8HN0EY+exq9v7Yn3mfFEj2d+6rCaqfNARKOwQZ6gPQXcIi+Db0Ow0I5l738elP}
# 1 hour
app.jwt.expiration-ms=3600000

logging.level.com.example.hospital_manager=INFO
